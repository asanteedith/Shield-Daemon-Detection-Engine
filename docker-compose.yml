version: '3.8'

services:
  nextcloud:
    image: kefaslungu/hng-nextcloud
    container_name: shieldguard-nextcloud
    restart: unless-stopped
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - shieldguard-network
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: shieldguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - hng-nginx-logs:/var/log/nginx
    networks:
      - shieldguard-network
    depends_on:
      - nextcloud

  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: shieldguard-detector
    restart: unless-stopped
    volumes:
      - hng-nginx-logs:/var/log/nginx:ro
      - ./detector/config.yaml:/app/config.yaml:ro
      - detector_logs:/var/log/detector
    network_mode: host
    cap_add:
      - NET_ADMIN
    depends_on:
      - nginx

volumes:
  nextcloud_data:
  hng-nginx-logs:
    name: HNG-nginx-logs
  detector_logs:

networks:
  shieldguard-network:
    driver: bridge
